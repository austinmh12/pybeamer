[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pybeamer"
version = "0.1.0"
description = "A Python wrapper for the Codebeamer v3 REST API"
readme = "readme.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Austin M. Hughes", email = "austinmh12@gmail.com"}]
keywords = ["codebeamer", "api", "rest", "tracker", "traceability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "requests>=2.25.0",
    "loguru>=0.5.0",
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/AndreaTorcianti/pybeamer"
Documentation = "https://github.com/AndreaTorcianti/pybeamer#readme"
Repository = "https://github.com/AndreaTorcianti/pybeamer.git"
Issues = "https://github.com/AndreaTorcianti/pybeamer/issues"

[tool.hatch.build.targets.wheel]
packages = ["pybeamer"]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
